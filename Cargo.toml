[package]
authors = ["Magicblock Labs <dev@magicblock.gg>"]
description = "Domain registration program for Ephemeral Rollups"
documentation = "https://docs.magicblock.gg/"
edition = "2021"
homepage = "https://www.magicblock.gg/"
keywords = ["crypto", "ephemeral-rollups", "magicblock", "registration", "solana"]
license = "MIT"
name = "magic-domain-program"
readme = "./README.md"
repository = "https://github.com/magicblock-labs/magic-domain-program"
version = "0.3.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "mdp"

[dependencies]
# solana
security-txt = { version = ">=1", package = "solana-security-txt", optional = true }
solana-program = { version = "4" }
solana-system-interface = { version = "3", features = ["bincode"] }


borsh = { version = ">=1", features = ["derive"] }
bytemuck_derive = ">=1.0"

[dev-dependencies]
solana-account = "4.3"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-native-token = "3"
solana-program-test = { version = "=4.1.1", features = ["agave-unstable-api"] }
solana-pubkey = "4.2"
solana-signer = "3"
solana-transaction = "4.1"
tokio = { version = ">=1", features = ["macros", "rt"] }

[features]
default = ["entrypoint"]
entrypoint = ["security-txt"]
